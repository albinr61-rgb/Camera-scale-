          mkdir -p "$(dirname 'app/src/main/java/com/arscale/app/OverlayView.kt')"
          cat > 'app/src/main/java/com/arscale/app/OverlayView.kt' <<'ARSCALE_EOF'
          package com.arscale.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.util.AttributeSet
          import android.view.View

          /** role: 0 = start, 1 = middle, 2 = end */
          class OverlayPoint(val label: String, val x: Float, val y: Float, val role: Int)

          class OverlaySegment(
              val x1: Float,
              val y1: Float,
              val x2: Float,
              val y2: Float,
              val text: String
          )

          class OverlayState(val points: List<OverlayPoint>, val segments: List<OverlaySegment>) {
              companion object {
                  val EMPTY = OverlayState(emptyList(), emptyList())
              }
          }

          /** Transparent view drawn above the camera: points (A, B, C...), lines and distances. */
          class OverlayView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              @Volatile
              var state: OverlayState = OverlayState.EMPTY

              private val d = resources.displayMetrics.density

              private val colorStart = Color.parseColor("#43A047")
              private val colorMid = Color.parseColor("#1E88E5")
              private val colorEnd = Color.parseColor("#E53935")

              private val lineOutline = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.BLACK
                  style = Paint.Style.STROKE
                  strokeWidth = 7f * d
                  strokeCap = Paint.Cap.ROUND
              }
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeWidth = 3.5f * d
                  strokeCap = Paint.Cap.ROUND
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val dotRing = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.FILL
              }
              private val pillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val labelText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 16f * d
                  typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER
              }
              private val segText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 14f * d
                  typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER
              }
              private val rect = RectF()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val s = state

                  for (seg in s.segments) {
                      canvas.drawLine(seg.x1, seg.y1, seg.x2, seg.y2, lineOutline)
                      canvas.drawLine(seg.x1, seg.y1, seg.x2, seg.y2, linePaint)
                  }

                  for (seg in s.segments) {
                      drawPill(
                          canvas,
                          (seg.x1 + seg.x2) / 2f,
                          (seg.y1 + seg.y2) / 2f,
                          seg.text,
                          Color.argb(210, 0, 0, 0),
                          segText
                      )
                  }

                  for (p in s.points) {
                      val color = when (p.role) {
                          0 -> colorStart
                          2 -> colorEnd
                          else -> colorMid
                      }
                      dotPaint.color = color
                      canvas.drawCircle(p.x, p.y, 9f * d, dotRing)
                      canvas.drawCircle(p.x, p.y, 6.5f * d, dotPaint)
                      drawPill(canvas, p.x, p.y - 26f * d, p.label, color, labelText)
                  }
              }

              private fun drawPill(
                  canvas: Canvas,
                  cx: Float,
                  cy: Float,
                  text: String,
                  bg: Int,
                  textPaint: Paint
              ) {
                  val w = textPaint.measureText(text)
                  val fm = textPaint.fontMetrics
                  val h = fm.descent - fm.ascent
                  val padX = 8f * d
                  val padY = 4f * d
                  rect.set(cx - w / 2f - padX, cy - h / 2f - padY, cx + w / 2f + padX, cy + h / 2f + padY)
                  pillPaint.color = bg
                  val radius = rect.height() / 2f
                  canvas.drawRoundRect(rect, radius, radius, pillPaint)
                  canvas.drawText(text, cx, cy - (fm.ascent + fm.descent) / 2f, textPaint)
              }
          }
          ARSCALE_EOF
