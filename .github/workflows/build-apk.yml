          mkdir -p "$(dirname 'app/src/main/java/com/arscale/app/Units.kt')"
          cat > 'app/src/main/java/com/arscale/app/Units.kt' <<'ARSCALE_EOF'
          package com.arscale.app

          import java.util.Locale

          /** Length units shared by the AR measure screen and the calculator. */
          enum class LengthUnit(
              val label: String,
              val perMeter: Double,
              val decimals: Int,
              val calcDecimals: Int
          ) {
              MM("mm", 1000.0, 0, 1),
              CM("cm", 100.0, 1, 2),
              M("m", 1.0, 3, 3),
              INCH("inch", 39.37007874, 2, 2),
              FEET("feet", 3.280839895, 2, 3);

              /** Metres -> text in this unit (AR measure screen). */
              fun format(meters: Double): String =
                  String.format(Locale.US, "%." + decimals + "f %s", meters * perMeter, label)

              /** A value that is already in this unit -> text (calculator). */
              fun formatValue(value: Double): String =
                  String.format(Locale.US, "%." + calcDecimals + "f %s", value, label)
          }
