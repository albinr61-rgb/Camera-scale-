          cat > 'app/src/main/java/com/arscale/app/DiagramView.kt' <<'ARSCALE_EOF'
          package com.arscale.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PointF
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * Picture for the calculator.
           *  - Triangle: a corner (45 or 90 degrees) with side A and side B, and the distance C between their ends.
           *  - Circle: diameter (full centre), radius (half centre) and the round length around it.
           */
          class DiagramView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              private val d = resources.displayMetrics.density

              private var mode = 0 // 1 = triangle, 2 = circle
              private var angleDeg = 90
              private var sideA = 4.0
              private var sideB = 3.0
              private var textA = "A"
              private var textB = "B"
              private var textC = "C"
              private var textD = "D"
              private var textR = "R"
              private var textRound = "Round"

              private val colorSide = Color.parseColor("#37474F")
              private val colorResult = Color.parseColor("#E65100")
              private val colorDia = Color.parseColor("#1565C0")
              private val colorRad = Color.parseColor("#2E7D32")
              private val colorFill = Color.parseColor("#E3EAF0")

              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
                  color = colorFill
              }
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeWidth = 3f * d
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val markPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 1.8f * d
                  color = Color.parseColor("#607D8B")
              }
              private val pillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 13f * d
                  typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER
              }
              private val angleText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#455A64")
                  textSize = 13f * d
                  typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER
              }
              private val rect = RectF()
              private val path = Path()

              /** Corner picture. Pass null sizes to draw a sample shape with the letters A, B, C. */
              fun showTriangle(angle: Int, a: Double?, b: Double?, labelA: String, labelB: String, labelC: String) {
                  mode = 1
                  angleDeg = angle
                  var sa = 4.0
                  var sb = 3.0
                  if (a != null && b != null && a > 0.0 && b > 0.0) {
                      sa = a
                      sb = b
                  }
                  // Keep very uneven sides drawable.
                  val m = max(sa, sb)
                  sideA = max(sa, m / 10.0)
                  sideB = max(sb, m / 10.0)
                  textA = labelA
                  textB = labelB
                  textC = labelC
                  invalidate()
              }

              fun showCircle(labelD: String, labelR: String, labelRound: String) {
                  mode = 2
                  textD = labelD
                  textR = labelR
                  textRound = labelRound
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (mode == 1) drawTriangle(canvas) else if (mode == 2) drawCircle(canvas)
              }

              private fun dist(a: PointF, b: PointF): Float {
                  val dx = a.x - b.x
                  val dy = a.y - b.y
                  return max(1f, sqrt(dx * dx + dy * dy))
              }

              private fun drawTriangle(canvas: Canvas) {
                  val rad = Math.toRadians(angleDeg.toDouble())
                  val px = sideA
                  val qx = sideB * cos(rad)
                  val qy = sideB * sin(rad)
                  val minX = min(0.0, min(px, qx))
                  val maxX = max(0.0, max(px, qx))
                  val bw = max(maxX - minX, 1e-9)
                  val bh = max(qy, 1e-9)

                  val padX = 48f * d
                  val padTop = 34f * d
                  val padBottom = 42f * d
                  val availW = width - 2f * padX
                  val availH = height - padTop - padBottom
                  if (availW <= 0f || availH <= 0f) return

                  val sc = min(availW / bw, availH / bh).toFloat()
                  val offX = padX + (availW - bw.toFloat() * sc) / 2f
                  val baseY = height - padBottom - (availH - bh.toFloat() * sc) / 2f

                  val o = PointF(offX + (0.0 - minX).toFloat() * sc, baseY)
                  val p = PointF(offX + (px - minX).toFloat() * sc, baseY)
                  val q = PointF(offX + (qx - minX).toFloat() * sc, baseY - qy.toFloat() * sc)

                  // body
                  path.reset()
                  path.moveTo(o.x, o.y)
                  path.lineTo(p.x, p.y)
                  path.lineTo(q.x, q.y)
                  path.close()
                  canvas.drawPath(path, fillPaint)

                  linePaint.color = colorSide
                  linePaint.strokeWidth = 3f * d
                  canvas.drawLine(o.x, o.y, p.x, p.y, linePaint)
                  canvas.drawLine(o.x, o.y, q.x, q.y, linePaint)
                  linePaint.color = colorResult
                  linePaint.strokeWidth = 4.5f * d
                  canvas.drawLine(p.x, p.y, q.x, q.y, linePaint)

                  // angle mark at the corner O
                  val lenOP = dist(o, p)
                  val lenOQ = dist(o, q)
                  val mr = min(24f * d, 0.4f * min(lenOP, lenOQ))
                  if (angleDeg == 90) {
                      val ux = (p.x - o.x) / lenOP
                      val uy = (p.y - o.y) / lenOP
                      val vx = (q.x - o.x) / lenOQ
                      val vy = (q.y - o.y) / lenOQ
                      path.reset()
                      path.moveTo(o.x + ux * mr, o.y + uy * mr)
                      path.lineTo(o.x + (ux + vx) * mr, o.y + (uy + vy) * mr)
                      path.lineTo(o.x + vx * mr, o.y + vy * mr)
                      canvas.drawPath(path, markPaint)
                  } else {
                      rect.set(o.x - mr, o.y - mr, o.x + mr, o.y + mr)
                      canvas.drawArc(rect, -angleDeg.toFloat(), angleDeg.toFloat(), false, markPaint)
                  }
                  val half = rad / 2.0
                  val tr = mr + 18f * d
                  val tx = o.x + tr * cos(half).toFloat()
                  val ty = o.y - tr * sin(half).toFloat()
                  canvas.drawText(angleDeg.toString() + "°", tx, ty + 5f * d, angleText)

                  // corner dots
                  dotPaint.color = colorSide
                  canvas.drawCircle(o.x, o.y, 4f * d, dotPaint)
                  canvas.drawCircle(p.x, p.y, 4f * d, dotPaint)
                  canvas.drawCircle(q.x, q.y, 4f * d, dotPaint)

                  // side labels, placed outside the triangle
                  val gx = (o.x + p.x + q.x) / 3f
                  val gy = (o.y + p.y + q.y) / 3f
                  sideLabel(canvas, o, p, gx, gy, textA, colorSide)
                  sideLabel(canvas, o, q, gx, gy, textB, colorSide)
                  sideLabel(canvas, p, q, gx, gy, textC, colorResult)
              }

              private fun sideLabel(canvas: Canvas, u: PointF, v: PointF, gx: Float, gy: Float, text: String, color: Int) {
                  val mx = (u.x + v.x) / 2f
                  val my = (u.y + v.y) / 2f
                  val len = dist(u, v)
                  val dx = (v.x - u.x) / len
                  val dy = (v.y - u.y) / len
                  var nx = -dy
                  var ny = dx
                  if (nx * (mx - gx) + ny * (my - gy) < 0f) {
                      nx = -nx
                      ny = -ny
                  }
                  drawPill(canvas, mx + nx * 20f * d, my + ny * 20f * d, text, color)
              }

              private fun drawCircle(canvas: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f - 4f * d
                  val r = min(width / 2f - 24f * d, height / 2f - 46f * d)
                  if (r <= 10f * d) return

                  canvas.drawCircle(cx, cy, r, fillPaint)

                  // round (circumference)
                  linePaint.color = colorResult
                  linePaint.strokeWidth = 4.5f * d
                  canvas.drawCircle(cx, cy, r, linePaint)

                  // diameter: full centre line
                  linePaint.color = colorDia
                  linePaint.strokeWidth = 3f * d
                  canvas.drawLine(cx - r, cy, cx + r, cy, linePaint)
                  canvas.drawLine(cx - r, cy - 7f * d, cx - r, cy + 7f * d, linePaint)
                  canvas.drawLine(cx + r, cy - 7f * d, cx + r, cy + 7f * d, linePaint)

                  // radius: half of the centre line
                  val ang = Math.toRadians(40.0)
                  val ex = cx + r * cos(ang).toFloat()
                  val ey = cy + r * sin(ang).toFloat()
                  linePaint.color = colorRad
                  linePaint.strokeWidth = 4f * d
                  canvas.drawLine(cx, cy, ex, ey, linePaint)

                  dotPaint.color = colorSide
                  canvas.drawCircle(cx, cy, 4.5f * d, dotPaint)

                  drawPill(canvas, cx, cy - 20f * d, textD, colorDia)

                  val mx = (cx + ex) / 2f
                  val my = (cy + ey) / 2f
                  val nx = (-sin(ang)).toFloat()
                  val ny = cos(ang).toFloat()
                  drawPill(canvas, mx + nx * 22f * d, my + ny * 22f * d, textR, colorRad)

                  drawPill(canvas, cx, cy + r + 24f * d, textRound, colorResult)
              }

              private fun drawPill(canvas: Canvas, cx0: Float, cy0: Float, text: String, bg: Int) {
                  val w = textPaint.measureText(text)
                  val fm = textPaint.fontMetrics
                  val h = fm.descent - fm.ascent
                  val padX = 8f * d
                  val padY = 4f * d
                  val halfW = w / 2f + padX
                  val halfH = h / 2f + padY
                  val cx = cx0.coerceIn(halfW + 2f * d, max(halfW + 2f * d, width - halfW - 2f * d))
                  val cy = cy0.coerceIn(halfH + 2f * d, max(halfH + 2f * d, height - halfH - 2f * d))
                  rect.set(cx - halfW, cy - halfH, cx + halfW, cy + halfH)
                  pillPaint.color = bg
                  canvas.drawRoundRect(rect, halfH, halfH, pillPaint)
                  canvas.drawText(text, cx, cy - (fm.ascent + fm.descent) / 2f, textPaint)
              }
          }
