                  android:text="Spirit Level"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:padding="20dp"
                  android:text="Lay the phone flat on a surface, or hold it upright against a wall / on its edge."
                  android:textColor="#B0B0B0"
                  android:textSize="14sp" />
          </FrameLayout>
          ARSCALE_EOF
          mkdir -p "$(dirname 'app/src/main/res/layout/activity_main.xml')"
          cat > 'app/src/main/res/layout/activity_main.xml' <<'ARSCALE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <android.opengl.GLSurfaceView
                  android:id="@+id/surfaceView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <com.arscale.app.OverlayView
                  android:id="@+id/overlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <com.arscale.app.LevelView
                  android:id="@+id/levelView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:background="#99000000"
                  android:orientation="vertical"
                  android:padding="12dp">

                  <TextView
                      android:id="@+id/totalText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Total: 0.0 cm"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/statusText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Move the phone slowly to start tracking"
                      android:textColor="#E0E0E0"
                      android:textSize="14sp" />

                  <TextView
                      android:id="@+id/segmentsText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:ellipsize="end"
                      android:maxLines="4"
                      android:textColor="#B0BEC5"
                      android:textSize="12sp"
                      android:visibility="gone" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#99000000"
                  android:orientation="horizontal"
                  android:padding="8dp">

                  <Button
                      android:id="@+id/btnUndo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:maxLines="1"
                      android:text="Undo"
                      android:textAllCaps="false"
                      android:textSize="13sp" />

                  <Button
                      android:id="@+id/btnEnd"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:maxLines="1"
                      android:text="End"
                      android:textAllCaps="false"
                      android:textSize="13sp" />

                  <Button
                      android:id="@+id/btnReset"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:maxLines="1"
                      android:text="Reset"
                      android:textAllCaps="false"
                      android:textSize="13sp" />

                  <Button
                      android:id="@+id/btnFlash"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1.5"
                      android:maxLines="1"
                      android:text="Flash: Off"
                      android:textAllCaps="false"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/btnSettings"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="0.9"
                      android:contentDescription="Settings"
                      android:maxLines="1"
                      android:text="⚙️"
                      android:textAllCaps="false"
                      android:textSize="20sp" />
              </LinearLayout>
          </FrameLayout>
          ARSCALE_EOF
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'ARSCALE_EOF'
          <resources>
              <string name="app_name">AR Scale</string>
          </resources>
          ARSCALE_EOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'ARSCALE_EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
              </style>

              <style name="HomeTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">#FAFAFA</item>
                  <item name="android:statusBarColor">#FAFAFA</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          ARSCALE_EOF
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'ARSCALE_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ARSCALE_EOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'ARSCALE_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          ARSCALE_EOF
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'ARSCALE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ARScale"
          include(":app")
          ARSCALE_EOF

      - name: Restore signing key
        working-directory: generated
        run: base64 -d app/arscale.keystore.b64 > app/arscale.keystore

      - name: Build debug APK
        working-directory: generated
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARScale-apk
          path: generated/app/build/outputs/apk/debug/app-debug.apk
