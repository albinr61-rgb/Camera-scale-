          package com.arscale.app

          import android.opengl.GLES11Ext
          import android.opengl.GLES20
          import com.google.ar.core.Coordinates2d
          import com.google.ar.core.Frame
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer

          /** Draws the live camera image (external OES texture) as a full-screen quad. */
          class BackgroundRenderer {

              var textureId: Int = -1
                  private set

              private var program = 0
              private var positionAttrib = 0
              private var texCoordAttrib = 0
              private var samplerUniform = 0

              private val quadCoords: FloatBuffer = allocFloats(QUAD_COORDS)
              private val quadTexCoords: FloatBuffer = allocFloats(FloatArray(8))

              fun createOnGlThread() {
                  val textures = IntArray(1)
                  GLES20.glGenTextures(1, textures, 0)
                  textureId = textures[0]

                  val target = GLES11Ext.GL_TEXTURE_EXTERNAL_OES
                  GLES20.glBindTexture(target, textureId)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)

                  program = createProgram(VERTEX_SHADER, FRAGMENT_SHADER)
                  positionAttrib = GLES20.glGetAttribLocation(program, "a_Position")
                  texCoordAttrib = GLES20.glGetAttribLocation(program, "a_TexCoord")
                  samplerUniform = GLES20.glGetUniformLocation(program, "sTexture")
              }

              fun draw(frame: Frame) {
                  if (frame.hasDisplayGeometryChanged()) {
                      quadCoords.position(0)
                      quadTexCoords.position(0)
                      frame.transformCoordinates2d(
                          Coordinates2d.OPENGL_NORMALIZED_DEVICE_COORDINATES,
                          quadCoords,
                          Coordinates2d.TEXTURE_NORMALIZED,
                          quadTexCoords
                      )
                      quadCoords.position(0)
                      quadTexCoords.position(0)
                  }

                  // No camera image yet.
                  if (frame.timestamp == 0L) return

                  GLES20.glDisable(GLES20.GL_DEPTH_TEST)
                  GLES20.glDepthMask(false)

                  GLES20.glActiveTexture(GLES20.GL_TEXTURE0)
                  GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, textureId)
                  GLES20.glUseProgram(program)
                  GLES20.glUniform1i(samplerUniform, 0)

                  GLES20.glVertexAttribPointer(positionAttrib, 2, GLES20.GL_FLOAT, false, 0, quadCoords)
                  GLES20.glVertexAttribPointer(texCoordAttrib, 2, GLES20.GL_FLOAT, false, 0, quadTexCoords)
                  GLES20.glEnableVertexAttribArray(positionAttrib)
                  GLES20.glEnableVertexAttribArray(texCoordAttrib)

                  GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)

                  GLES20.glDisableVertexAttribArray(positionAttrib)
                  GLES20.glDisableVertexAttribArray(texCoordAttrib)

                  GLES20.glDepthMask(true)
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST)
              }

              private fun createProgram(vertexSource: String, fragmentSource: String): Int {
                  val vs = compileShader(GLES20.GL_VERTEX_SHADER, vertexSource)
                  val fs = compileShader(GLES20.GL_FRAGMENT_SHADER, fragmentSource)
                  val p = GLES20.glCreateProgram()
                  GLES20.glAttachShader(p, vs)
                  GLES20.glAttachShader(p, fs)
                  GLES20.glLinkProgram(p)
                  val status = IntArray(1)
                  GLES20.glGetProgramiv(p, GLES20.GL_LINK_STATUS, status, 0)
                  if (status[0] == 0) {
                      val log = GLES20.glGetProgramInfoLog(p)
                      GLES20.glDeleteProgram(p)
                      throw RuntimeException("Could not link program: $log")
                  }
                  return p
              }

              private fun compileShader(type: Int, source: String): Int {
                  val shader = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(shader, source)
                  GLES20.glCompileShader(shader)
                  val status = IntArray(1)
                  GLES20.glGetShaderiv(shader, GLES20.GL_COMPILE_STATUS, status, 0)
                  if (status[0] == 0) {
                      val log = GLES20.glGetShaderInfoLog(shader)
                      GLES20.glDeleteShader(shader)
                      throw RuntimeException("Could not compile shader: $log")
                  }
                  return shader
              }

              companion object {
                  private val QUAD_COORDS = floatArrayOf(
                      -1f, -1f,
                      -1f, 1f,
                      1f, -1f,
                      1f, 1f
                  )

                  private val VERTEX_SHADER = """
                      attribute vec4 a_Position;
                      attribute vec2 a_TexCoord;
                      varying vec2 v_TexCoord;
                      void main() {
                          gl_Position = a_Position;
                          v_TexCoord = a_TexCoord;
                      }
                  """.trimIndent()

                  private val FRAGMENT_SHADER = """
                      #extension GL_OES_EGL_image_external : require
                      precision mediump float;
                      varying vec2 v_TexCoord;
                      uniform samplerExternalOES sTexture;
                      void main() {
                          gl_FragColor = texture2D(sTexture, v_TexCoord);
                      }
                  """.trimIndent()

                  private fun allocFloats(data: FloatArray): FloatBuffer {
                      val fb = ByteBuffer.allocateDirect(data.size * 4)
                          .order(ByteOrder.nativeOrder())
                          .asFloatBuffer()
                      fb.put(data)
                      fb.position(0)
                      return fb
                  }
              }
          }
          ARSCALE_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/arscale/app/CalcActivity.kt')"
          cat > 'app/src/main/java/com/arscale/app/CalcActivity.kt' <<'ARSCALE_EOF'
          package com.arscale.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale
          import kotlin.math.PI
          import kotlin.math.acos
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * 45 / 90 degree corner calculator and round (circle) calculator.
           *
           *  - Corner: two sides measured from a corner (A and B) -> distance between their ends (C).
           *  - Round: give diameter, radius or the round length -> all the others.
           */
          class CalcActivity : Activity() {

              private var shape = 90 // 45, 90, or 360 (round)
              private var roundMode = 0 // 0 = diameter, 1 = radius, 2 = round length
              private var unit = LengthUnit.CM

              private lateinit var btn45: Button
              private lateinit var btn90: Button
              private lateinit var btnRound: Button
              private lateinit var btnUnit: Button
              private lateinit var lblKnow: TextView
              private lateinit var roundRow: LinearLayout
              private lateinit var btnKnowD: Button
              private lateinit var btnKnowR: Button
              private lateinit var btnKnowC: Button
              private lateinit var lblMain: TextView
              private lateinit var lblSecond: TextView
              private lateinit var inMain: EditText
              private lateinit var inSecond: EditText
              private lateinit var diagram: DiagramView
              private lateinit var resultBox: LinearLayout
              private lateinit var noteText: TextView

              private val density: Float get() = resources.displayMetrics.density

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_calc)

                  btn45 = findViewById(R.id.btn45)
                  btn90 = findViewById(R.id.btn90)
                  btnRound = findViewById(R.id.btnRound)
                  btnUnit = findViewById(R.id.btnCalcUnit)
                  lblKnow = findViewById(R.id.lblKnow)
                  roundRow = findViewById(R.id.roundRow)
                  btnKnowD = findViewById(R.id.btnKnowD)
                  btnKnowR = findViewById(R.id.btnKnowR)
                  btnKnowC = findViewById(R.id.btnKnowC)
                  lblMain = findViewById(R.id.lblMain)
                  lblSecond = findViewById(R.id.lblSecond)
                  inMain = findViewById(R.id.inMain)
                  inSecond = findViewById(R.id.inSecond)
                  diagram = findViewById(R.id.diagram)
                  resultBox = findViewById(R.id.resultBox)
                  noteText = findViewById(R.id.noteText)

                  btn45.setOnClickListener { select(45) }
                  btn90.setOnClickListener { select(90) }
                  btnRound.setOnClickListener { select(360) }
                  btnKnowD.setOnClickListener { selectRoundMode(0) }
                  btnKnowR.setOnClickListener { selectRoundMode(1) }
                  btnKnowC.setOnClickListener { selectRoundMode(2) }
                  btnUnit.setOnClickListener { showUnitDialog() }

                  val watcher = object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          recalc()
                      }
                  }
                  inMain.addTextChangedListener(watcher)
                  inSecond.addTextChangedListener(watcher)

                  select(90)
              }

              private fun select(s: Int) {
                  shape = s
                  styleButton(btn45, s == 45)
                  styleButton(btn90, s == 90)
                  styleButton(btnRound, s == 360)
                  styleRoundButtons()
                  updateLabels()
                  recalc()
              }

              private fun selectRoundMode(m: Int) {
                  roundMode = m
                  styleRoundButtons()
                  updateLabels()
                  recalc()
              }

              private fun styleRoundButtons() {
                  styleButton(btnKnowD, roundMode == 0)
                  styleButton(btnKnowR, roundMode == 1)
                  styleButton(btnKnowC, roundMode == 2)
              }

              private fun styleButton(b: Button, selected: Boolean) {
                  b.setBackgroundColor(Color.parseColor(if (selected) "#37474F" else "#CFD8DC"))
                  b.setTextColor(if (selected) Color.WHITE else Color.parseColor("#222222"))
              }

              private fun updateLabels() {
                  val u = unit.label
                  btnUnit.text = "Unit: " + u
                  if (shape == 360) {
                      lblKnow.visibility = View.VISIBLE
                      roundRow.visibility = View.VISIBLE
                      lblSecond.visibility = View.GONE
                      inSecond.visibility = View.GONE
                      lblMain.text = when (roundMode) {
                          0 -> "Diameter - full centre (" + u + ")"
                          1 -> "Radius - half centre (" + u + ")"
                          else -> "Round length around the circle (" + u + ")"
                      }
                      inMain.hint = "e.g. 30"
                      noteText.text = "Round = π × Diameter     Diameter = 2 × Radius     Area = π × Radius²"
                  } else {
                      lblKnow.visibility = View.GONE
                      roundRow.visibility = View.GONE
                      lblSecond.visibility = View.VISIBLE
                      inSecond.visibility = View.VISIBLE
                      lblMain.text = "Side A, from the corner (" + u + ")"
                      lblSecond.text = "Side B, from the corner (" + u + ")"
                      inMain.hint = "e.g. 15"
                      inSecond.hint = "e.g. 20"
                      noteText.text = "C = √(A² + B² − 2·A·B·cos " + shape + "°)"
                  }
              }

              private fun num(e: EditText): Double? =
                  e.text.toString().trim().replace(',', '.').toDoubleOrNull()

              private fun recalc() {
                  resultBox.removeAllViews()
                  val first = num(inMain)
                  if (shape == 360) recalcRound(first) else recalcCorner(first, num(inSecond))
              }

              /** Two sides from a corner -> distance between their ends. */
              private fun recalcCorner(a: Double?, b: Double?) {
                  if (a == null || a <= 0.0 || b == null || b <= 0.0) {
                      diagram.showTriangle(shape, null, null, "A", "B", "C = ?")
                      addNote("Enter side A and side B to get the distance between their ends.")
                      return
                  }
                  val rad = shape * PI / 180.0
                  val cosT = if (shape == 90) 0.0 else cos(rad)
                  val c = sqrt(a * a + b * b - 2.0 * a * b * cosT)
                  val angA = Math.toDegrees(acos(((a * a + c * c - b * b) / (2.0 * a * c)).coerceIn(-1.0, 1.0)))
                  val angB = 180.0 - shape - angA
                  val area = 0.5 * a * b * sin(rad)

                  diagram.showTriangle(
                      shape, a, b,
                      "A = " + unit.formatValue(a),
                      "B = " + unit.formatValue(b),
                      "C = " + unit.formatValue(c)
                  )

                  addRow("Distance between the two ends (C)", unit.formatValue(c))
                  addRow("Angle at end of A", String.format(Locale.US, "%.1f°", angA))
                  addRow("Angle at end of B", String.format(Locale.US, "%.1f°", angB))
                  addRow("Area of the triangle", String.format(Locale.US, "%.2f %s²", area, unit.label))
              }

              /** Diameter, radius or round length -> all of them. */
              private fun recalcRound(v: Double?) {
                  if (v == null || v <= 0.0) {
                      diagram.showCircle("D = ?", "R = ?", "Round = ?")
                      addNote("Enter a value to get the full centre, half centre and round length.")
                      return
                  }
                  val dia = when (roundMode) {
                      0 -> v
                      1 -> v * 2.0
                      else -> v / PI
                  }
                  val r = dia / 2.0
                  val round = PI * dia
                  val area = PI * r * r

                  diagram.showCircle(
                      "D = " + unit.formatValue(dia),
                      "R = " + unit.formatValue(r),
                      "Round = " + unit.formatValue(round)
                  )

                  addRow("Centre full (Diameter)", unit.formatValue(dia))
                  addRow("Centre half (Radius)", unit.formatValue(r))
                  addRow("Round length", unit.formatValue(round))
                  addRow("Area", String.format(Locale.US, "%.2f %s²", area, unit.label))
              }

              private fun addNote(text: String) {
                  val t = TextView(this)
                  t.text = text
                  t.setTextColor(Color.parseColor("#777777"))
                  t.textSize = 15f
                  resultBox.addView(t)
              }

              private fun addRow(label: String, value: String) {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val pad = (7 * density).toInt()
                  row.setPadding(0, pad, 0, pad)

                  val l = TextView(this)
                  l.text = label
                  l.setTextColor(Color.parseColor("#555555"))
                  l.textSize = 15f
                  l.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)

                  val v = TextView(this)
                  v.text = value
                  v.setTextColor(Color.parseColor("#222222"))
                  v.textSize = 17f
                  v.setTypeface(null, Typeface.BOLD)

                  row.addView(l)
                  row.addView(v)
                  resultBox.addView(row)
              }

              private fun showUnitDialog() {
                  val units = LengthUnit.values()
                  AlertDialog.Builder(this)
                      .setTitle("Select unit")
                      .setItems(units.map { it.label }.toTypedArray()) { _, which ->
                          unit = units[which]
                          updateLabels()
                          recalc()
                      }
                      .show()
              }
          }
