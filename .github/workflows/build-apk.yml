          package com.arscale.app

          import android.app.Activity
          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Bundle
          import android.view.Surface
          import android.view.WindowManager
          import android.widget.Toast

          /** Stand-alone spirit level screen (no camera needed). Rotates with the phone. */
          class LevelActivity : Activity(), SensorEventListener {

              private lateinit var levelView: LevelView

              // Smoothed gravity in the phone's own axes (these do not change when the screen rotates).
              private val gravity = FloatArray(3)
              private var gravityInit = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_level)
                  levelView = findViewById(R.id.levelView)
              }

              override fun onResume() {
                  super.onResume()
                  val sm = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val sensor = sm.getDefaultSensor(Sensor.TYPE_GRAVITY)
                      ?: sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  if (sensor == null) {
                      Toast.makeText(this, "This phone has no tilt sensor", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  gravityInit = false
                  sm.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
              }

              override fun onPause() {
                  super.onPause()
                  (getSystemService(Context.SENSOR_SERVICE) as SensorManager).unregisterListener(this)
              }

              override fun onSensorChanged(event: SensorEvent) {
                  if (!gravityInit) {
                      for (i in 0..2) gravity[i] = event.values[i]
                      gravityInit = true
                  } else {
                      // Light smoothing so the bubble does not jitter.
                      for (i in 0..2) gravity[i] += 0.2f * (event.values[i] - gravity[i])
                  }

                  // Convert from the phone's axes to the screen's axes for the current rotation,
                  // so the level always lines up with what is drawn on screen.
                  @Suppress("DEPRECATION")
                  val rotation = windowManager.defaultDisplay.rotation
                  val x: Float
                  val y: Float
                  when (rotation) {
                      Surface.ROTATION_90 -> {
                          x = -gravity[1]
                          y = gravity[0]
                      }
                      Surface.ROTATION_180 -> {
                          x = -gravity[0]
                          y = -gravity[1]
                      }
                      Surface.ROTATION_270 -> {
                          x = gravity[1]
                          y = -gravity[0]
                      }
                      else -> {
                          x = gravity[0]
                          y = gravity[1]
                      }
                  }
                  levelView.setGravity(x, y, gravity[2])
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
          ARSCALE_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/arscale/app/LevelView.kt')"
          cat > 'app/src/main/java/com/arscale/app/LevelView.kt' <<'ARSCALE_EOF'
          package com.arscale.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.util.AttributeSet
          import android.view.View
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.acos
          import kotlin.math.asin
          import kotlin.math.atan2
          import kotlin.math.min
          import kotlin.math.sqrt

          /**
           * Spirit level drawn from the phone's gravity sensor.
           *
           * - Phone lying flat (on a table / floor): round bubble level, shows tilt in both directions.
           * - Phone held upright (against a wall, or on its edge): horizontal bubble tube, shows how much the
           *   phone is rotated from level, plus the forward/back lean.
           *
           * Like a real level, the bubble moves toward the HIGH side.
           */
          class LevelView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              private val d = resources.displayMetrics.density

              private var gx = 0f
              private var gy = 0f
              private var gz = 0f
              private var hasData = false

              private val colorOk = Color.parseColor("#43A047")
              private val colorNear = Color.parseColor("#FFB300")
              private val colorBad = Color.parseColor("#E53935")

              private val panelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(190, 0, 0, 0)
                  style = Paint.Style.FILL
              }
              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeWidth = 2.5f * d
              }
              private val markPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.argb(200, 255, 255, 255)
                  style = Paint.Style.STROKE
                  strokeWidth = 1.5f * d
              }
              private val bubblePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val bubbleRim = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeWidth = 2f * d
              }
              private val bigText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 22f * d
                  typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER
              }
              private val smallText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#E0E0E0")
                  textSize = 14f * d
                  textAlign = Paint.Align.CENTER
              }
              private val rect = RectF()

              /** Gravity reading in device axes (m/s^2): x = right, y = up the screen, z = out of the screen. */
              fun setGravity(x: Float, y: Float, z: Float) {
                  gx = x
                  gy = y
                  gz = z
                  hasData = true
                  invalidate()
              }

              private fun statusColor(angle: Float): Int {
                  val a = abs(angle)
                  return if (a < 0.5f) colorOk else if (a < 2f) colorNear else colorBad
              }

              private fun fmt(v: Float): String = String.format(Locale.US, "%.1f°", v)

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (!hasData) return
                  val g = sqrt(gx * gx + gy * gy + gz * gz)
                  if (g < 1f) return

                  val cx = width / 2f
                  val cy = height / 2f
                  val flat = abs(gz) / g > 0.8f

                  // Shrink the level to fit when the screen is short (landscape).
                  val needW = (if (flat) 248f else 308f) * d
                  val needH = (if (flat) 324f else 180f) * d
                  val s = min(1f, min((width - 32f * d) / needW, (height - 128f * d) / needH)).coerceAtLeast(0.4f)

                  canvas.save()
                  canvas.translate(cx, cy)
                  canvas.scale(s, s)
                  canvas.translate(-cx, -cy)
                  if (flat) drawFlat(canvas, cx, cy, g) else drawUpright(canvas, cx, cy, g)
                  canvas.restore()
              }

              private fun drawFlat(canvas: Canvas, cx: Float, cy: Float, g: Float) {
                  val tiltX = Math.toDegrees(asin((gx / g).coerceIn(-1f, 1f).toDouble())).toFloat()
                  val tiltY = Math.toDegrees(asin((gy / g).coerceIn(-1f, 1f).toDouble())).toFloat()
                  val total = Math.toDegrees(acos((abs(gz) / g).coerceIn(0f, 1f).toDouble())).toFloat()

                  val r = 100f * d
                  val ccy = cy - 38f * d
                  rect.set(cx - r - 24f * d, ccy - r - 24f * d, cx + r + 24f * d, ccy + r + 100f * d)
                  canvas.drawRoundRect(rect, 20f * d, 20f * d, panelPaint)

                  canvas.drawCircle(cx, ccy, r, ringPaint)
                  canvas.drawCircle(cx, ccy, 18f * d, markPaint)
                  canvas.drawLine(cx - r, ccy, cx + r, ccy, markPaint)
                  canvas.drawLine(cx, ccy - r, cx, ccy + r, markPaint)

                  // 10 degrees of tilt = bubble at the edge. Bubble goes to the high side.
                  var ox = (tiltX / 10f).coerceIn(-1f, 1f) * r
                  var oy = (-tiltY / 10f).coerceIn(-1f, 1f) * r
                  val len = sqrt(ox * ox + oy * oy)
                  val maxLen = r - 16f * d
                  if (len > maxLen) {
                      ox *= maxLen / len
                      oy *= maxLen / len
                  }
                  bubblePaint.color = statusColor(total)
                  canvas.drawCircle(cx + ox, ccy + oy, 16f * d, bubblePaint)
                  canvas.drawCircle(cx + ox, ccy + oy, 16f * d, bubbleRim)

                  val label = if (total < 0.5f) "LEVEL" else "Tilt " + fmt(total)
                  canvas.drawText(label, cx, ccy + r + 40f * d, bigText)
                  canvas.drawText("Left-right " + fmt(tiltX) + "   Up-down " + fmt(tiltY), cx, ccy + r + 68f * d, smallText)
              }

              private fun drawUpright(canvas: Canvas, cx: Float, cy0: Float, g: Float) {
                  val cy = cy0 - 43f * d
                  // Rotation of the phone in the plane of the screen, folded to the nearest 90 degrees so it
                  // works for portrait and landscape. Positive = right side low.
                  var theta = Math.toDegrees(atan2(-gx.toDouble(), gy.toDouble())).toFloat()
                  theta -= 90f * Math.round(theta / 90f)
                  val lean = Math.toDegrees(asin((gz / g).coerceIn(-1f, 1f).toDouble())).toFloat()

                  val tubeW = 260f * d
                  val tubeH = 46f * d
                  rect.set(cx - tubeW / 2f - 24f * d, cy - tubeH / 2f - 24f * d, cx + tubeW / 2f + 24f * d, cy + tubeH / 2f + 110f * d)
                  canvas.drawRoundRect(rect, 20f * d, 20f * d, panelPaint)

                  rect.set(cx - tubeW / 2f, cy - tubeH / 2f, cx + tubeW / 2f, cy + tubeH / 2f)
                  canvas.drawRoundRect(rect, tubeH / 2f, tubeH / 2f, ringPaint)
                  canvas.drawLine(cx - 18f * d, cy - tubeH / 2f, cx - 18f * d, cy + tubeH / 2f, markPaint)
                  canvas.drawLine(cx + 18f * d, cy - tubeH / 2f, cx + 18f * d, cy + tubeH / 2f, markPaint)

                  val travel = tubeW / 2f - 22f * d
                  val ox = (-theta / 10f).coerceIn(-1f, 1f) * travel
                  bubblePaint.color = statusColor(theta)
                  canvas.drawCircle(cx + ox, cy, 16f * d, bubblePaint)
                  canvas.drawCircle(cx + ox, cy, 16f * d, bubbleRim)

                  val label = if (abs(theta) < 0.5f) "LEVEL" else "Tilt " + fmt(abs(theta))
                  canvas.drawText(label, cx, cy + tubeH / 2f + 42f * d, bigText)
                  canvas.drawText("Forward/back lean " + fmt(lean), cx, cy + tubeH / 2f + 70f * d, smallText)
              }
          }
          ARSCALE_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/arscale/app/MainActivity.kt')"
          cat > 'app/src/main/java/com/arscale/app/MainActivity.kt' <<'ARSCALE_EOF'
          package com.arscale.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.PointF
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.hardware.display.DisplayManager
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.Matrix
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import com.google.ar.core.Anchor
          import com.google.ar.core.ArCoreApk
          import com.google.ar.core.Camera
          import com.google.ar.core.Config
          import com.google.ar.core.DepthPoint
          import com.google.ar.core.Frame
          import com.google.ar.core.HitResult
          import com.google.ar.core.LightEstimate
          import com.google.ar.core.Plane
          import com.google.ar.core.Session
          import com.google.ar.core.TrackingFailureReason
          import com.google.ar.core.TrackingState
          import com.google.ar.core.exceptions.CameraNotAvailableException
          import com.google.ar.core.exceptions.UnavailableApkTooOldException
          import com.google.ar.core.exceptions.UnavailableArcoreNotInstalledException
          import com.google.ar.core.exceptions.UnavailableDeviceNotCompatibleException
          import com.google.ar.core.exceptions.UnavailableSdkTooOldException
          import com.google.ar.core.exceptions.UnavailableUserDeclinedInstallationException
          import java.util.Locale
          import java.util.concurrent.ConcurrentLinkedQueue
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.sqrt
          import com.google.ar.core.Point as ArPoint

          class MainActivity : Activity(), GLSurfaceView.Renderer {

              private enum class FlashSetting(val label: String) {
                  OFF("Off"),
                  ON("On"),
                  AUTO("Auto")
              }

              private class MeasurePoint(val anchor: Anchor, val label: String)

              companion object {
                  private const val CAMERA_REQUEST = 1

                  // Points farther than WARN are accepted but flagged; farther than MAX are rejected.
                  private const val WARN_HIT_DISTANCE = 5f
                  private const val MAX_HIT_DISTANCE = 25f
              }

              private var session: Session? = null
              private var installRequested = false

              private lateinit var surfaceView: GLSurfaceView
              private lateinit var overlay: OverlayView
              private lateinit var totalText: TextView
              private lateinit var statusText: TextView
              private lateinit var segmentsText: TextView
              private lateinit var btnSettings: Button
              private lateinit var btnFlash: Button
              private lateinit var levelView: LevelView

              // Spirit level (UI thread only)
              private var levelOn = false
              private val gravity = FloatArray(3)
              private var gravityInit = false

              private val levelListener = object : SensorEventListener {
                  override fun onSensorChanged(event: SensorEvent) {
                      if (!gravityInit) {
                          for (i in 0..2) gravity[i] = event.values[i]
                          gravityInit = true
                      } else {
                          // Light smoothing so the bubble does not jitter.
                          for (i in 0..2) gravity[i] += 0.2f * (event.values[i] - gravity[i])
                      }
                      levelView.setGravity(gravity[0], gravity[1], gravity[2])
                  }

                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              }

              // Calibration factor: shown distance = ARCore distance * scale (1.0 = not calibrated).
              @Volatile
              private var scale = 1.0

              @Volatile
              private var hasFlash = false

              @Volatile
              private var flashSetting = FlashSetting.OFF

              // GL thread only
              private var torchOn = false
              private var darkFrames = 0
              private var autoLatched = false

              private val background = BackgroundRenderer()

              // UI thread -> GL thread hand-off
              private val taps = ConcurrentLinkedQueue<PointF>()
              private val commands = ConcurrentLinkedQueue<() -> Unit>()

              // Touched only on the GL thread
              private val points = ArrayList<MeasurePoint>()
              private var finished = false
              private var trackingLost = false

              @Volatile
              private var unit = LengthUnit.CM

              private var viewportW = 1
              private var viewportH = 1

              @Volatile
              private var viewportChanged = false

              private var lastTotal = ""
              private var lastStatus = ""
              private var lastSegments = ""

              private val viewMatrix = FloatArray(16)
              private val projMatrix = FloatArray(16)
              private val vpMatrix = FloatArray(16)

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) {}
                  override fun onDisplayRemoved(displayId: Int) {}
                  override fun onDisplayChanged(displayId: Int) {
                      viewportChanged = true
                  }
              }

              // ---------------------------------------------------------------- lifecycle

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  surfaceView = findViewById(R.id.surfaceView)
                  overlay = findViewById(R.id.overlay)
                  totalText = findViewById(R.id.totalText)
                  statusText = findViewById(R.id.statusText)
                  segmentsText = findViewById(R.id.segmentsText)
                  btnSettings = findViewById(R.id.btnSettings)
                  btnFlash = findViewById(R.id.btnFlash)

                  scale = try {
                      getSharedPreferences("arscale", MODE_PRIVATE).getFloat("scale", 1f).toDouble()
                  } catch (e: Exception) {
                      1.0
                  }
                  if (scale < 0.05 || scale > 20.0) scale = 1.0

                  levelView = findViewById(R.id.levelView)

                  surfaceView.preserveEGLContextOnPause = true
                  surfaceView.setEGLContextClientVersion(2)
                  surfaceView.setEGLConfigChooser(8, 8, 8, 8, 16, 0)
                  surfaceView.setRenderer(this)
                  surfaceView.renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY
                  surfaceView.setWillNotDraw(false)

                  // A tap anywhere on the camera view places a point there.
                  surfaceView.setOnTouchListener { _, ev ->
                      if (ev.actionMasked == MotionEvent.ACTION_UP) {
                          taps.add(PointF(ev.x, ev.y))
                      }
                      true
                  }

                  findViewById<Button>(R.id.btnUndo).setOnClickListener {
                      commands.add({ undoPoint() })
                  }
                  findViewById<Button>(R.id.btnEnd).setOnClickListener {
                      commands.add({ endMeasurement() })
                  }
                  findViewById<Button>(R.id.btnReset).setOnClickListener {
                      commands.add({ resetAll() })
                  }
                  btnSettings.setOnClickListener { showSettingsDialog() }

                  // Flash: Off -> On -> Auto -> Off
                  btnFlash.setOnClickListener {
                      if (!hasFlash) {
                          toast("This camera has no flash")
                      } else {
                          flashSetting = when (flashSetting) {
                              FlashSetting.OFF -> FlashSetting.ON
                              FlashSetting.ON -> FlashSetting.AUTO
                              FlashSetting.AUTO -> FlashSetting.OFF
                          }
                          updateFlashButton()
                      }
                  }
                  updateFlashButton()
              }

              override fun onResume() {
                  super.onResume()
                  if (levelOn) startLevelSensor()

                  if (session == null) {
                      session = createSession() ?: return
                      updateFlashButton()
                  }
                  // The camera restarts on resume; re-read the real torch state on the GL thread.
                  commands.add({ torchOn = session?.config?.flashMode == Config.FlashMode.TORCH })

                  try {
                      session?.resume()
                  } catch (e: CameraNotAvailableException) {
                      Toast.makeText(this, "Camera not available. Close other camera apps and retry.", Toast.LENGTH_LONG).show()
                      session = null
                      return
                  }

                  getSystemService(DisplayManager::class.java)?.registerDisplayListener(displayListener, null)
                  surfaceView.onResume()
                  viewportChanged = true
              }

              override fun onPause() {
                  super.onPause()
                  stopLevelSensor()
                  if (session != null) {
                      getSystemService(DisplayManager::class.java)?.unregisterDisplayListener(displayListener)
                      // GLSurfaceView must be paused before the session so the GL thread stops using it.
                      surfaceView.onPause()
                      session?.pause()
                  }
              }

              override fun onDestroy() {
                  session?.close()
                  session = null
                  super.onDestroy()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == CAMERA_REQUEST &&
                      (grantResults.isEmpty() || grantResults[0] != PackageManager.PERMISSION_GRANTED)
                  ) {
                      Toast.makeText(this, "Camera permission is required for AR Scale", Toast.LENGTH_LONG).show()
                      finish()
                  }
              }

              private fun createSession(): Session? {
                  try {
                      if (ArCoreApk.getInstance().requestInstall(this, !installRequested) ==
                          ArCoreApk.InstallStatus.INSTALL_REQUESTED
                      ) {
                          installRequested = true
                          return null
                      }

                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.CAMERA), CAMERA_REQUEST)
                          return null
                      }

                      val s = Session(this)
                      val config = s.config
                      config.planeFindingMode = Config.PlaneFindingMode.HORIZONTAL_AND_VERTICAL
                      config.updateMode = Config.UpdateMode.LATEST_CAMERA_IMAGE
                      config.focusMode = Config.FocusMode.AUTO
                      // Needed for the Auto flash mode (measures how dark the scene is).
                      config.lightEstimationMode = Config.LightEstimationMode.AMBIENT_INTENSITY
                      config.flashMode = Config.FlashMode.OFF
                      if (s.isDepthModeSupported(Config.DepthMode.AUTOMATIC)) {
                          // Depth lets us measure plain walls where plane detection struggles.
                          config.depthMode = Config.DepthMode.AUTOMATIC
                      }
                      s.configure(config)

                      hasFlash = try {
                          val manager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          manager.getCameraCharacteristics(s.cameraConfig.cameraId)
                              .get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } catch (e: Exception) {
                          false
                      }
                      return s
                  } catch (e: UnavailableUserDeclinedInstallationException) {
                      fatal("Please install \"Google Play Services for AR\" to use this app.")
                  } catch (e: UnavailableArcoreNotInstalledException) {
                      fatal("Please install \"Google Play Services for AR\" to use this app.")
                  } catch (e: UnavailableApkTooOldException) {
                      fatal("Please update \"Google Play Services for AR\".")
                  } catch (e: UnavailableSdkTooOldException) {
                      fatal("Please update this app.")
                  } catch (e: UnavailableDeviceNotCompatibleException) {
                      fatal("This device does not support AR.")
                  } catch (e: Exception) {
                      fatal("Could not start AR: " + e.message)
                  }
                  return null
              }

              private fun fatal(message: String) {
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show()
                  finish()
              }

              // ---------------------------------------------------------------- GL renderer

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0f, 0f, 0f, 1f)
                  background.createOnGlThread()
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES20.glViewport(0, 0, width, height)
                  viewportW = width
                  viewportH = height
                  viewportChanged = true
              }

              override fun onDrawFrame(gl: GL10?) {
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT or GLES20.GL_DEPTH_BUFFER_BIT)
                  val session = this.session ?: return

                  if (viewportChanged) {
                      @Suppress("DEPRECATION")
                      val rotation = windowManager.defaultDisplay.rotation
                      session.setDisplayGeometry(rotation, viewportW, viewportH)
                      viewportChanged = false
                  }
                  session.setCameraTextureName(background.textureId)

                  val frame: Frame = try {
                      session.update()
                  } catch (e: CameraNotAvailableException) {
                      setStatus("Camera not available. Close other apps using the camera.")
                      return
                  } catch (e: Exception) {
                      return
                  }

                  background.draw(frame)
                  val camera = frame.camera

                  // Undo / End / Reset requests from the buttons.
                  while (true) {
                      val command = commands.poll() ?: break
                      command()
                  }

                  updateTorch(session, frame, camera)

                  // Taps -> new points.
                  val tracking = camera.trackingState == TrackingState.TRACKING
                  if (!tracking && points.isNotEmpty() && !finished) {
                      // Positions may drift while tracking is lost, so remember it and warn in the result.
                      trackingLost = true
                  }
                  while (true) {
                      val tap = taps.poll() ?: break
                      if (finished) {
                          toast("Measurement ended. Press Reset to start again.")
                          continue
                      }
                      if (!tracking) {
                          toast("Tracking not ready. " + failureHint(camera))
                          continue
                      }
                      val hit = pickHit(frame, tap.x, tap.y)
                      if (hit == null) {
                          toast("No surface found there. Move slowly / closer and tap again.")
                          continue
                      }
                      if (hit.distance > MAX_HIT_DISTANCE) {
                          toast("That point is too far (%.0f m). Move closer and tap again.".format(Locale.US, hit.distance))
                          continue
                      }
                      if (hit.distance > WARN_HIT_DISTANCE) {
                          toast("Far point (%.1f m): less accurate. Add a point every 3-4 m for a better result.".format(Locale.US, hit.distance))
                      }
                      points.add(MeasurePoint(hit.createAnchor(), labelFor(points.size)))
                  }

                  publish(camera, tracking)
              }

              /**
               * Applies the flash setting. Auto turns the torch on once the scene has been dark for about a
               * second and keeps it on (so it doesn't flicker as the torch itself brightens the scene).
               */
              private fun updateTorch(session: Session, frame: Frame, camera: Camera) {
                  if (!hasFlash) return
                  val desired = when (flashSetting) {
                      FlashSetting.OFF -> {
                          autoLatched = false
                          darkFrames = 0
                          false
                      }
                      FlashSetting.ON -> {
                          autoLatched = false
                          darkFrames = 0
                          true
                      }
                      FlashSetting.AUTO -> {
                          val estimate = frame.lightEstimate
                          val dark = camera.trackingFailureReason == TrackingFailureReason.INSUFFICIENT_LIGHT ||
                              (estimate.state == LightEstimate.State.VALID && estimate.pixelIntensity < 0.15f)
                          darkFrames = if (dark) darkFrames + 1 else 0
                          if (darkFrames > 30) autoLatched = true
                          autoLatched
                      }
                  }
                  if (desired != torchOn) {
                      try {
                          val cfg = session.config
                          cfg.flashMode = if (desired) Config.FlashMode.TORCH else Config.FlashMode.OFF
                          session.configure(cfg)
                          torchOn = desired
                      } catch (e: Exception) {
                          hasFlash = false
                          runOnUiThread { updateFlashButton() }
                      }
                  }
              }

              private fun updateFlashButton() {
                  btnFlash.text = if (hasFlash) "Flash: " + flashSetting.label else "Flash: n/a"
              }

              /**
               * Prefers a detected plane (exact polygon first, then its bounding box so far-away parts of a
               * long wall still work), then a depth point, then a feature point (least reliable).
               */
              private fun pickHit(frame: Frame, x: Float, y: Float): HitResult? {
                  var plane: HitResult? = null
                  var planeExtent: HitResult? = null
                  var depth: HitResult? = null
                  var feature: HitResult? = null
                  for (hit in frame.hitTest(x, y)) {
                      val t = hit.trackable
                      if (t is Plane) {
                          if (plane == null && t.isPoseInPolygon(hit.hitPose)) {
                              plane = hit
                          } else if (planeExtent == null && t.isPoseInExtents(hit.hitPose)) {
                              planeExtent = hit
                          }
                      } else if (t is DepthPoint) {
                          if (depth == null) depth = hit
                      } else if (t is ArPoint) {
                          if (feature == null && t.orientationMode == ArPoint.OrientationMode.ESTIMATED_SURFACE_NORMAL) {
                              feature = hit
                          }
                      }
                  }
                  return plane ?: planeExtent ?: depth ?: feature
              }

              private fun failureHint(camera: Camera): String {
                  return when (camera.trackingFailureReason) {
                      TrackingFailureReason.INSUFFICIENT_LIGHT -> "Too dark - turn on the lights or set Flash to On/Auto."
                      TrackingFailureReason.EXCESSIVE_MOTION -> "Moving too fast - slow down."
                      TrackingFailureReason.INSUFFICIENT_FEATURES -> "Point at a surface with more detail/texture."
                      else -> "Move the phone slowly."
                  }
              }

              // ---------------------------------------------------------------- measuring

              private fun labelFor(index: Int): String {
                  // A, B, ... Z, AA, AB, ...
                  var n = index
                  val sb = StringBuilder()
                  do {
                      sb.insert(0, 'A' + n % 26)
                      n = n / 26 - 1
                  } while (n >= 0)
                  return sb.toString()
              }

              /** Straight ARCore distance in metres, without calibration. */
              private fun rawDist(a: Anchor, b: Anchor): Double {
                  val pa = a.pose
                  val pb = b.pose
                  val dx = (pa.tx() - pb.tx()).toDouble()
                  val dy = (pa.ty() - pb.ty()).toDouble()
                  val dz = (pa.tz() - pb.tz()).toDouble()
                  return sqrt(dx * dx + dy * dy + dz * dz)
              }

              /** Distance in metres after applying the calibration factor. */
              private fun dist(a: Anchor, b: Anchor): Double = rawDist(a, b) * scale

              // ---------------------------------------------------------------- spirit level

              private fun setLevel(on: Boolean) {
                  levelOn = on
                  levelView.visibility = if (on) View.VISIBLE else View.GONE
                  if (on) startLevelSensor() else stopLevelSensor()
              }

              private fun startLevelSensor() {
                  val sm = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val sensor = sm.getDefaultSensor(Sensor.TYPE_GRAVITY)
                      ?: sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  if (sensor == null) {
                      toast("This phone has no tilt sensor")
                      levelOn = false
                      levelView.visibility = View.GONE
                      return
                  }
                  gravityInit = false
                  sm.registerListener(levelListener, sensor, SensorManager.SENSOR_DELAY_GAME)
              }

              private fun stopLevelSensor() {
                  (getSystemService(Context.SENSOR_SERVICE) as SensorManager).unregisterListener(levelListener)
              }

              // ---------------------------------------------------------------- calibration

              private fun showCalibrateMenu() {
                  val items = arrayOf(
                      "Calibrate using the points on screen",
                      "Clear calibration (back to x1.000)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle(String.format(Locale.US, "Calibration (now x%.3f)", scale))
                      .setItems(items) { _, which ->
                          if (which == 0) commands.add({ beginCalibration() }) else setScale(1.0)
                      }
                      .show()
              }

              /** GL thread: needs at least A and B placed on a length you know. */
              private fun beginCalibration() {
                  if (points.size < 2) {
                      toast("First tap A and B on a known length (e.g. 100 cm), then press Calibrate again.")
                      return
                  }
                  var raw = 0.0
                  for (i in 1 until points.size) raw += rawDist(points[i - 1].anchor, points[i].anchor)
                  if (raw < 0.02) {
                      toast("Measured length is too small to calibrate.")
                      return
                  }
                  runOnUiThread { askRealLength(raw) }
              }

              private fun askRealLength(rawMeters: Double) {
                  val u = unit
                  val input = EditText(this)
                  input.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  input.setText(if (u == LengthUnit.CM) "100" else "")
                  input.setSelection(input.text.length)
                  AlertDialog.Builder(this)
                      .setTitle("Real length (" + u.label + ")")
                      .setMessage("ARCore measured " + u.format(rawMeters) + ". Enter the true length you measured.")
                      .setView(input)
                      .setPositiveButton("Set") { _, _ ->
                          val v = input.text.toString().trim().toDoubleOrNull()
                          if (v == null || v <= 0.0) {
                              toast("Enter a valid number.")
                          } else {
                              val s = (v / u.perMeter) / rawMeters
                              if (s < 0.05 || s > 20.0) {
                                  toast("That differs too much from the measured value. Not applied.")
                              } else {
                                  setScale(s)
                              }
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun setScale(s: Double) {
                  scale = s
                  try {
                      getSharedPreferences("arscale", MODE_PRIVATE).edit().putFloat("scale", s.toFloat()).apply()
                  } catch (e: Exception) {
                      // Calibration still applies for this session.
                  }
                  toast(String.format(Locale.US, "Calibration set: x%.3f", s))
              }

              private fun undoPoint() {
                  if (points.isEmpty()) return
                  points.removeAt(points.size - 1).anchor.detach()
                  finished = false
                  if (points.isEmpty()) trackingLost = false
              }

              private fun resetAll() {
                  for (p in points) p.anchor.detach()
                  points.clear()
                  finished = false
                  trackingLost = false
              }

              private fun endMeasurement() {
                  if (points.size < 2) {
                      toast("Add at least 2 points first.")
                      return
                  }
                  finished = true
                  val text = summaryText()
                  runOnUiThread {
                      AlertDialog.Builder(this)
                          .setTitle("Measurement result")
                          .setMessage(text)
                          .setPositiveButton("OK", null)
                          .show()
                  }
              }

              private fun summaryText(): String {
                  val sb = StringBuilder()
                  sb.append("Start: ").append(points.first().label)
                      .append("     End: ").append(points.last().label).append("\n\n")
                  var total = 0.0
                  for (i in 1 until points.size) {
                      val d = dist(points[i - 1].anchor, points[i].anchor)
                      total += d
                      sb.append(points[i - 1].label).append(" → ").append(points[i].label)
                          .append(" : ").append(unit.format(d)).append('\n')
                  }
                  sb.append("\nTotal : ").append(unit.format(total))
                  if (trackingLost) {
                      sb.append("\n\nWarning: tracking was lost while measuring, so this result may be wrong. ")
                          .append("Use good light, move slowly and measure again.")
                  }
                  return sb.toString()
              }

              // ---------------------------------------------------------------- overlay / projection

              private fun publish(camera: Camera, tracking: Boolean) {
                  if (tracking) {
                      camera.getViewMatrix(viewMatrix, 0)
                      camera.getProjectionMatrix(projMatrix, 0, 0.05f, 100f)
                      Matrix.multiplyMM(vpMatrix, 0, projMatrix, 0, viewMatrix, 0)
                  }

                  val clips = ArrayList<FloatArray?>(points.size)
                  for (p in points) clips.add(if (tracking) clipOf(p.anchor) else null)

                  val ovPoints = ArrayList<OverlayPoint>()
                  val ovSegs = ArrayList<OverlaySegment>()

                  for (i in points.indices) {
                      val c = clips[i] ?: continue
                      if (c[3] > 0.01f) {
                          val s = toScreen(c)
                          val role = if (i == 0) 0 else if (finished && i == points.size - 1) 2 else 1
                          ovPoints.add(OverlayPoint(points[i].label, s.x, s.y, role))
                      }
                  }

                  var total = 0.0
                  val segList = StringBuilder()
                  for (i in 1 until points.size) {
                      val d = dist(points[i - 1].anchor, points[i].anchor)
                      total += d
                      if (segList.isNotEmpty()) segList.append("  |  ")
                      segList.append(points[i - 1].label).append("→").append(points[i].label)
                          .append(' ').append(unit.format(d))
                      val a = clips[i - 1]
                      val b = clips[i]
                      if (a != null && b != null) {
                          val seg = clipSegment(a, b)
                          if (seg != null) {
                              val s0 = toScreen(seg.first)
                              val s1 = toScreen(seg.second)
                              ovSegs.add(OverlaySegment(s0.x, s0.y, s1.x, s1.y, unit.format(d)))
                          }
                      }
                  }

                  updateSegments(segList.toString())
                  overlay.state = OverlayState(ovPoints, ovSegs)
                  overlay.postInvalidate()

                  updateTexts(camera, tracking, total)
              }

              private fun clipOf(anchor: Anchor): FloatArray? {
                  if (anchor.trackingState != TrackingState.TRACKING) return null
                  val pose = anchor.pose
                  val v = floatArrayOf(pose.tx(), pose.ty(), pose.tz(), 1f)
                  val out = FloatArray(4)
                  Matrix.multiplyMV(out, 0, vpMatrix, 0, v, 0)
                  return out
              }

              private fun toScreen(c: FloatArray): PointF {
                  val nx = c[0] / c[3]
                  val ny = c[1] / c[3]
                  return PointF((nx * 0.5f + 0.5f) * viewportW, (1f - (ny * 0.5f + 0.5f)) * viewportH)
              }

              /** Clips a segment (in clip space) against the near side so lines stay visible when one end is behind us. */
              private fun clipSegment(a: FloatArray, b: FloatArray): Pair<FloatArray, FloatArray>? {
                  val eps = 0.01f
                  var p0 = a
                  var p1 = b
                  if (p0[3] < eps && p1[3] < eps) return null
                  if (p0[3] < eps) {
                      p0 = lerp(p0, p1, (eps - p0[3]) / (p1[3] - p0[3]))
                  } else if (p1[3] < eps) {
                      p1 = lerp(p1, p0, (eps - p1[3]) / (p0[3] - p1[3]))
                  }
                  return Pair(p0, p1)
              }

              private fun lerp(from: FloatArray, to: FloatArray, t: Float): FloatArray =
                  FloatArray(4) { from[it] + (to[it] - from[it]) * t }

              // ---------------------------------------------------------------- UI helpers

              private fun updateTexts(camera: Camera, tracking: Boolean, total: Double) {
                  val totalLabel = (if (finished) "Final total: " else "Total: ") + unit.format(total)
                  val status = when {
                      !tracking -> "Tracking lost. " + failureHint(camera)
                      trackingLost && !finished -> "Warning: tracking was lost, result may be off. Reset and retry."
                      finished -> "Measurement ended. Press Reset for a new one."
                      points.isEmpty() -> "Tap the start point (A)"
                      else -> "Tap the next point (" + labelFor(points.size) + ") or press End"
                  }
                  if (totalLabel != lastTotal) {
                      lastTotal = totalLabel
                      runOnUiThread { totalText.text = totalLabel }
                  }
                  setStatus(status)
              }

              private fun setStatus(text: String) {
                  if (text != lastStatus) {
                      lastStatus = text
                      runOnUiThread { statusText.text = text }
                  }
              }

              private fun toast(message: String) {
                  runOnUiThread { Toast.makeText(this, message, Toast.LENGTH_SHORT).show() }
              }

              /** Small list under the total: A→B, B→C ... in order. */
              private fun updateSegments(text: String) {
                  if (text != lastSegments) {
                      lastSegments = text
                      runOnUiThread {
                          segmentsText.text = text
                          segmentsText.visibility = if (text.isEmpty()) View.GONE else View.VISIBLE
                      }
                  }
              }

              private fun showSettingsDialog() {
                  val cal = if (Math.abs(scale - 1.0) < 1e-6) {
                      "not calibrated"
                  } else {
                      String.format(Locale.US, "x%.3f", scale)
                  }
                  val items = arrayOf(
                      "Unit: " + unit.label,
                      "Calibrate (" + cal + ")",
                      "Spirit level overlay: " + (if (levelOn) "On" else "Off")
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Settings")
                      .setItems(items) { _, which ->
                          when (which) {
                              0 -> showUnitDialog()
                              1 -> showCalibrateMenu()
                              else -> setLevel(!levelOn)
                          }
                      }
                      .show()
              }

              private fun showUnitDialog() {
                  val units = LengthUnit.values()
                  AlertDialog.Builder(this)
                      .setTitle("Select unit")
                      .setItems(units.map { it.label }.toTypedArray()) { _, which ->
                          unit = units[which]
                      }
                      .show()
              }
          }
